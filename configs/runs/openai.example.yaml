# Copy to a new ID, fill model capability/price fields from the enabled account,
# and record the pricing source/version before running. No guessed prices.
execution_mode: live
run:
  models:
    - provider: openai
      model_id: YOUR_OPENAI_MODEL_ID
      capabilities:
        tool_calling: true
        structured_output: false
        parallel_tool_calls: false
        native_compaction: false
        context_window: 128000
        max_output_tokens: 4096
      input_usd_per_million: null
      output_usd_per_million: null
      cached_input_usd_per_million: null
      price_version: unconfigured
  max_escalations: 0
  budget:
    max_cost_usd: "1.00"
    max_model_turns: 15
    max_tool_calls: 50
    max_output_tokens: 4096
  context:
    strategy: evidence_compact
    input_budget: 24000
    continuation_mode: portable
  require_write_approval: true

name: forge-local
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: forge
      POSTGRES_PASSWORD: ${FORGE_POSTGRES_PASSWORD:-forge_local}
      POSTGRES_DB: forge
    ports:
      - "127.0.0.1:55471:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forge -d forge"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  postgres-data:
